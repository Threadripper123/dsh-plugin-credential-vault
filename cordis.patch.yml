- id: credentials
  name: "@deepseek-ai/dsh-credentials-local"
  disabled: true
- insert:
    - id: credential-vault-provider
      name: dsh-plugin-credential-vault/provider
    - id: credential-vault-management
      name: dsh-plugin-credential-vault
    - id: preset-vault-guarded
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: vault-guarded
        name: 凭据受控会话
        description: 原生工具调用；默认禁用工具，仅供接入已审核连接器操作
        order: 20
        plugins:
          - id: vault-guard
            name: dsh-plugin-credential-vault/guarded-session
            config:
              allow: []
